<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Build good habits, one day at a time." />
    <!-- Reset links carry a token in the URL; never send it to another site as a referrer. -->
    <meta name="referrer" content="no-referrer" />
    <title>Habits</title>
    <script>
      // Paint the last-used theme before the app loads, so a dark-mode user doesn't see a light flash.
      // ThemeSync (src/theme/ThemeSync.tsx) writes this key and takes over once the session loads.
      try {
        var pref = localStorage.getItem("habits-theme");
        var dark = pref === "DARK" || (pref !== "LIGHT" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
